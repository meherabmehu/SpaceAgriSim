name: Validate scientific mission platform
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
          SPACEAGRISIM_DATABASE_URL: 'sqlite:///:memory:'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt

  # The job above runs on SQLite, so every PostgreSQL test skips. A skip is not a pass: before
  # this job existed, 24 persistence, transaction, constraint and connection-failure tests were
  # green by absence on every run. This job provisions a real server and fails the build if a
  # PostgreSQL test does not execute.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spaceagrisim
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: spaceagrisim_test
        ports:
          - 5432:5432
        # Wait for the server to accept connections before the first step runs, rather than
        # sleeping and hoping.
        options: >-
          --health-cmd "pg_isready -U spaceagrisim -d spaceagrisim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A test database in a throwaway container. Nothing here names, reaches or resembles a
      # production URL, and the workflow never reads a deployment secret.
      SPACEAGRISIM_TEST_POSTGRES_URL: 'postgresql+psycopg://spaceagrisim:ci-only-test-password@127.0.0.1:5432/spaceagrisim_test'
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      # pg_restore is what the backup/restore-verification tests shell out to; without the
      # PostgreSQL client the one test that needs it skips instead of running.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Confirm the server is real and reachable
        run: |
          python - <<'PY'
          import os, psycopg
          url = os.environ["SPACEAGRISIM_TEST_POSTGRES_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("select version()")
                  print(cursor.fetchone()[0])
          PY
      - name: PostgreSQL-specific suites (skips are failures here)
        run: |
          python -m pytest -q backend/tests/test_postgresql_persistence.py \
                            backend/tests/test_postgres_integration.py \
                            backend/tests/test_scenario_persistence_api.py \
                            backend/tests/test_workspace.py \
                            backend/tests/test_phase19_database_configuration.py \
                            backend/tests/test_phase22_backup_automation.py \
                            -rs
      - name: Full suite against PostgreSQL (no skips permitted)
        run: |
          set -o pipefail
          python -m pytest -q backend/tests -rs | tee /tmp/pg-suite.log
          if grep -q "skipped" /tmp/pg-suite.log; then
            echo "::error::a test skipped in the PostgreSQL job; a skip here is a missing check"
            exit 1
          fi
      - name: Report the dialect the suite actually used
        if: always()
        run: |
          python - <<'PY'
          import os
          from app.config.settings import resolve_database_url
          print("resolved:", resolve_database_url(os.environ["SPACEAGRISIM_TEST_POSTGRES_URL"], ""))
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
