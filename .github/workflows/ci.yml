name: Validate scientific mission platform
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Full history: the model-card tests verify that each card's pinned commit actually
      # contains the script it names, and `git cat-file <old-sha>:<path>` fails with exit 128 in a
      # depth-1 clone. That is a checkout-configuration failure, not a test failure, so the fix is
      # here rather than a skip in the test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
          SPACEAGRISIM_DATABASE_URL: 'sqlite:///:memory:'
      - run: python -m pip install pip-audit
      # Both files: the runtime pins are what ships, but a vulnerable test-only package is still a
      # vulnerable path into a developer machine and a CI runner.
      - run: python -m pip_audit -r backend/requirements.txt -r backend/requirements-dev.txt
      # Static analysis for the application code itself. The gate fails on *any* finding, not on a
      # severity floor: the five findings this repository has were each reviewed and marked on the
      # line that raised them with the reason (`docs/FINAL_SECURITY_REVIEW.md` lists all five), so a
      # new one is a signal rather than noise.
      - run: python -m pip install bandit
      - run: python -m bandit -q -r backend/app

  # The job above runs on SQLite, so every PostgreSQL test skips. A skip is not a pass: before
  # this job existed, 24 persistence, transaction, constraint and connection-failure tests were
  # green by absence on every run. This job provisions a real server and fails the build if a
  # PostgreSQL test does not execute.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spaceagrisim
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: spaceagrisim_test
        ports:
          - 5432:5432
        # Wait for the server to accept connections before the first step runs, rather than
        # sleeping and hoping.
        options: >-
          --health-cmd "pg_isready -U spaceagrisim -d spaceagrisim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A test database in a throwaway container. Nothing here names, reaches or resembles a
      # production URL, and the workflow never reads a deployment secret.
      SPACEAGRISIM_TEST_POSTGRES_URL: 'postgresql+psycopg://spaceagrisim:ci-only-test-password@127.0.0.1:5432/spaceagrisim_test'
      PYTHONPATH: backend
    steps:
      # Full history: the model-card tests verify that each card's pinned commit actually
      # contains the script it names, and `git cat-file <old-sha>:<path>` fails with exit 128 in a
      # depth-1 clone. That is a checkout-configuration failure, not a test failure, so the fix is
      # here rather than a skip in the test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      # pg_restore is what the backup/restore-verification tests shell out to; without the
      # PostgreSQL client the one test that needs it skips instead of running.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Confirm the server is real and reachable
        run: |
          python - <<'PY'
          import os, psycopg
          url = os.environ["SPACEAGRISIM_TEST_POSTGRES_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("select version()")
                  print(cursor.fetchone()[0])
          PY
      - name: PostgreSQL-specific suites (skips are failures here)
        run: |
          python -m pytest -q backend/tests/test_postgresql_persistence.py \
                            backend/tests/test_postgres_integration.py \
                            backend/tests/test_scenario_persistence_api.py \
                            backend/tests/test_workspace.py \
                            backend/tests/test_phase19_database_configuration.py \
                            backend/tests/test_phase22_backup_automation.py \
                            -rs
      - name: Full suite against PostgreSQL (no skips permitted)
        run: |
          set -o pipefail
          python -m pytest -q backend/tests -rs | tee /tmp/pg-suite.log
          if grep -q "skipped" /tmp/pg-suite.log; then
            echo "::error::a test skipped in the PostgreSQL job; a skip here is a missing check"
            exit 1
          fi
      - name: Report the dialect the suite actually used
        if: always()
        run: |
          python - <<'PY'
          import os
          from app.config.settings import resolve_database_url
          print("resolved:", resolve_database_url(os.environ["SPACEAGRISIM_TEST_POSTGRES_URL"], ""))
          PY
  # The scientific gates live beside the suites rather than inside them: each is a script that
  # recomputes a published number from the committed artifacts. Until this job existed they ran
  # only when someone remembered to run them, which is how a model card drifts from its evidence
  # without any test going red. Every script is stdlib-only and every step is `--check`, so the job
  # proves the committed state rather than rewriting it.
  science:
    runs-on: ubuntu-latest
    steps:
      # Full history: the model-card tests verify that each card's pinned commit actually
      # contains the script it names, and `git cat-file <old-sha>:<path>` fails with exit 128 in a
      # depth-1 clone. That is a checkout-configuration failure, not a test failure, so the fix is
      # here rather than a skip in the test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Model audit (registry, cards, removed capabilities, evidence verdicts)
        env:
          PYTHONPATH: backend
        run: python scripts/audit_models.py
      - name: Registry checksums and training environment
        env:
          PYTHONPATH: backend
        run: python scripts/verify_model_registry.py --check
      - name: Provenance manifest
        run: python ml/training/phase32_provenance.py --check
      - name: Feature readiness
        run: python ml/research/build_feature_readiness.py --check
      - name: Feature coverage
        run: python ml/research/build_feature_coverage.py --check
      - name: Dataset gap matrix
        run: python ml/research/build_gap_matrix.py --check
      - name: Measured evidence to model cards
        run: python ml/research/phase34_record_measurements.py --check
      - name: Evidence verdicts
        run: python ml/research/phase35_evidence_verdicts.py --check
      - name: Screenshot store is deduplicated
        run: python ml/research/dedupe_screenshots.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # No npm cache: a cache needs `cache-dependency-path`, and the lockfile it would name is a
      # JavaScript module here (frontend/dependencies.lock.mjs) rather than a package-lock.json.
      # The install is a 291-package `npm ci` from that lock, a few seconds either way.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # `ci` materialises package.json and package-lock.json into a temporary directory outside
      # this checkout, installs there, and deletes both before returning - no .json file is ever
      # written inside the repository. See frontend/scripts/npm.mjs.
      - run: node scripts/npm.mjs ci
      - run: node scripts/npm.mjs lint
      - run: node scripts/npm.mjs typecheck
      # jsdom unit tests for the resource hook's lifecycle. The browser suite renders the same
      # panels, but it cannot schedule the microtask order in which a superseded response resolves
      # before the abort that follows it - which is the defect these tests exist to prevent from
      # coming back.
      - run: node scripts/npm.mjs test:unit
      # `build:check` runs the production build *and* the bundle guard (no import cycles, no
      # oversized chunk, initial request within the 240 kB budget). A plain `build` would let a
      # regression past as long as it compiled.
      - run: node scripts/npm.mjs build:check
      # `npm audit` needs the lockfile next to it, so it also runs against the temporary manifests.
      - run: node scripts/npm.mjs --audit
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: node scripts/npm.mjs ci
      - run: node scripts/npm.mjs --exec playwright install --with-deps chromium
      - run: node scripts/npm.mjs test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
