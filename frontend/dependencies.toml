# The frontend's dependency manifest.
#
# npm reads package.json and cannot read anything else, and this repository may not hold a .json
# file. So the manifest is this TOML file - the format the rest of the repository's hand-written
# configuration already uses - and scripts/npm.mjs writes the JSON npm wants into a temporary
# directory outside the checkout, installs from it, and deletes it again.
#
# The versions, scripts and structure below are the ones the frontend was building and testing
# with before the package.json they came from was removed. Nothing was added or dropped.
#
# Keys containing a character TOML does not allow in a bare key (":", "@", "/") are quoted.

name = "spaceagrisim-frontend"
version = "0.1.0"
private = true
type = "module"
description = "Dashboard for the Space Agriculture & Life Support Simulator"

[scripts]
dev = "vite"
build = "vite build"
preview = "vite preview"
lint = "eslint ."
typecheck = "tsc --noEmit --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types vite/client src/services/platformApi.ts src/vite-env.d.ts"
"test:e2e" = "playwright test"
"test:unit" = "vitest run"
"build:check" = "vite build && node scripts/check-bundle.mjs"

[dependencies]
lucide-react = "^1.70.0"
react = "^19.1.0"
react-dom = "^19.1.0"
recharts = "^3.10.1"

[devDependencies]
"@eslint/js" = "^9.39.5"
"@playwright/test" = "^1.65.0"
"@tailwindcss/vite" = "^4.1.0"
"@testing-library/dom" = "^10.4.2"
"@testing-library/react" = "^16.3.3"
"@types/react" = "^19.3.0"
"@types/react-dom" = "^19.3.0"
"@vitejs/plugin-react" = "^4.5.0"
eslint = "^9.39.5"
eslint-plugin-react-hooks = "^7.1.1"
eslint-plugin-react-refresh = "^0.5.6"
globals = "^17.12.0"
jsdom = "^29.1.1"
tailwindcss = "^4.1.0"
typescript = "^7.0.2"
vite = "^7.0.0"
vitest = "^4.1.12"
